<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrownFall - Asset Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #c8a96e;
    }
    .stats {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 30px;
      display: flex;
      gap: 30px;
      justify-content: center;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #4ade80;
    }
    .stat-label {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .asset-card {
      background: #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .asset-card:hover {
      transform: translateY(-5px);
    }
    .asset-preview {
      width: 100%;
      height: 250px;
      background: #1a1a1a;
      position: relative;
    }
    .asset-info {
      padding: 15px;
    }
    .asset-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #c8a96e;
    }
    .asset-meta {
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }
    .tag {
      display: inline-block;
      background: #3a3a3a;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 5px;
      margin-top: 5px;
      font-size: 11px;
    }
    .loading {
      text-align: center;
      padding: 50px;
      font-size: 18px;
      color: #888;
    }
    .error {
      background: #4a1a1a;
      color: #ff6b6b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>🎨 CrownFall Asset Gallery</h1>
  
  <div class="stats" id="stats">
    <div class="stat">
      <div class="stat-value" id="total-assets">-</div>
      <div class="stat-label">Total Assets</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-triangles">-</div>
      <div class="stat-label">Total Triangles</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-size">-</div>
      <div class="stat-label">Total Size</div>
    </div>
  </div>

  <div id="error-container"></div>
  <div id="loading" class="loading">Loading assets...</div>
  <div id="gallery" class="gallery"></div>

  <script type="module">
    import * as THREE from 'three';
    import { AssetManager } from './src/engine/assets/manager.js';
    import { SAMPLE_MANIFEST } from './src/engine/assets/sample-manifest.js';

    const assetManager = new AssetManager();
    const gallery = document.getElementById('gallery');
    const loading = document.getElementById('loading');
    const errorContainer = document.getElementById('error-container');

    async function init() {
      try {
        await assetManager.init();
        await assetManager.loadManifest(SAMPLE_MANIFEST);

        const validation = assetManager.validate();
        if (!validation.valid) {
          showError(`Manifest validation failed: ${validation.errors.join(', ')}`);
          return;
        }

        if (validation.warnings.length > 0) {
          console.warn('Validation warnings:', validation.warnings);
        }

        // Update stats
        document.getElementById('total-assets').textContent = validation.stats.totalAssets;
        document.getElementById('total-triangles').textContent = validation.stats.totalTriangles.toLocaleString();
        document.getElementById('total-size').textContent = formatBytes(validation.stats.totalSize);

        // Load and display all assets
        for (const [id, entry] of Object.entries(SAMPLE_MANIFEST.assets)) {
          try {
            const asset = await assetManager.load(id);
            displayAsset(id, entry, asset);
          } catch (error) {
            console.error(`Failed to load asset ${id}:`, error);
            displayError(id, error.message);
          }
        }

        loading.style.display = 'none';
      } catch (error) {
        loading.style.display = 'none';
        showError(`Initialization failed: ${error.message}`);
      }
    }

    function displayAsset(id, entry, asset) {
      const card = document.createElement('div');
      card.className = 'asset-card';

      const preview = document.createElement('div');
      preview.className = 'asset-preview';

      // Create Three.js scene for preview
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);

      const camera = new THREE.PerspectiveCamera(50, 300 / 250, 0.1, 1000);
      camera.position.set(0, 2, 5);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(300, 250);
      renderer.setPixelRatio(window.devicePixelRatio);
      preview.appendChild(renderer.domElement);

      // Add lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 5);
      scene.add(directionalLight);

      // Add asset
      const object = asset.data.clone();
      scene.add(object);

      // Add grid
      const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
      scene.add(gridHelper);

      // Render once
      renderer.render(scene, camera);

      const info = document.createElement('div');
      info.className = 'asset-info';

      const name = document.createElement('div');
      name.className = 'asset-name';
      name.textContent = id;

      const meta = document.createElement('div');
      meta.className = 'asset-meta';
      meta.innerHTML = `
        <div><strong>Type:</strong> ${entry.type}</div>
        <div><strong>Source:</strong> ${entry.source}</div>
        <div><strong>Version:</strong> ${entry.version}</div>
        ${entry.metadata?.triangles ? `<div><strong>Triangles:</strong> ${entry.metadata.triangles}</div>` : ''}
      `;

      if (entry.metadata?.tags) {
        const tags = document.createElement('div');
        tags.style.marginTop = '10px';
        entry.metadata.tags.forEach(tag => {
          const tagEl = document.createElement('span');
          tagEl.className = 'tag';
          tagEl.textContent = tag;
          tags.appendChild(tagEl);
        });
        meta.appendChild(tags);
      }

      info.appendChild(name);
      info.appendChild(meta);

      card.appendChild(preview);
      card.appendChild(info);

      gallery.appendChild(card);
    }

    function displayError(id, message) {
      const card = document.createElement('div');
      card.className = 'asset-card';
      card.innerHTML = `
        <div class="asset-preview" style="display: flex; align-items: center; justify-content: center; color: #ff6b6b;">
          <div style="text-align: center;">
            <div style="font-size: 48px;">⚠️</div>
            <div style="margin-top: 10px;">Failed to load</div>
          </div>
        </div>
        <div class="asset-info">
          <div class="asset-name">${id}</div>
          <div class="asset-meta" style="color: #ff6b6b;">${message}</div>
        </div>
      `;
      gallery.appendChild(card);
    }

    function showError(message) {
      const error = document.createElement('div');
      error.className = 'error';
      error.textContent = message;
      errorContainer.appendChild(error);
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    init();
  </script>
</body>
</html>
